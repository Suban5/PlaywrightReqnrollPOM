name: Run Tests & Generate Allure Report

on:
  push:
    branches: [ main, master, Report_enhancement ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allows manual trigger

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🔧 Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: 🎭 Setup Playwright Browsers
      run: |
        dotnet build
        pwsh PlaywrightReqnrollFramework/bin/Debug/net8.0/playwright.ps1 install --with-deps chromium
        
    - name: 📦 Restore dependencies
      run: dotnet restore
      
    - name: 🔨 Build
      run: dotnet build --no-restore --configuration Release
      
    - name: 🧪 Run Tests
      run: dotnet test --no-build --configuration Release --logger "console;verbosity=detailed"
      continue-on-error: true  # Continue even if tests fail
      
    - name: 📊 Get Allure history
      uses: actions/checkout@v4
      if: always()
      continue-on-error: true
      with:
        ref: gh-pages
        path: gh-pages
        
    - name: 📈 Generate Allure Report
      uses: simple-elf/allure-report-action@master
      if: always()
      with:
        allure_results: PlaywrightReqnrollFramework/bin/Release/net8.0/allure-results
        allure_history: allure-history
        keep_reports: 20
        
    - name: 🚀 Deploy Allure Report to GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: allure-history
        force_orphan: true
        
    - name: 📎 Upload Allure Results as Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-results
        path: PlaywrightReqnrollFramework/bin/Release/net8.0/allure-results
        retention-days: 30
        
    - name: 📸 Upload Screenshots
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-screenshots
        path: PlaywrightReqnrollFramework/bin/Release/net8.0/TestResults/Screenshots
        retention-days: 30
